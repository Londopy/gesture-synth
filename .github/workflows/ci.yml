name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Rust core
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p gsyn-core -p gsyn-wasm --check
      - run: cargo clippy -p gsyn-core -- -D warnings
      - run: cargo test -p gsyn-core

  core-zig:
    name: Rust core with Zig kernel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gsyn-core --features zig
      - name: Zig kernel tests
        working-directory: crates/gsyn-zig
        run: zig build test
      - name: Zig kernel builds for wasm32
        working-directory: crates/gsyn-zig
        run: zig build -Dtarget=wasm32-freestanding -Doptimize=ReleaseFast

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-models.mjs --copy-only
      - run: npm run wasm
      - name: Type check
        working-directory: app
        run: npx svelte-check --tsconfig ./tsconfig.json
      - name: Unit tests
        working-directory: app
        run: npx vitest run
      - name: Build
        working-directory: app
        run: npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist

  community:
    name: Community service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18"
          rebar3-version: "3"
      - working-directory: services/community
        run: gleam format --check src test
      - working-directory: services/community
        run: gleam test

  desktop:
    name: Desktop shell compiles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg sidecar (Tauri's build script requires the file to exist)
        run: node scripts/fetch-ffmpeg.mjs --static
      - run: mkdir -p app/dist && echo '<!doctype html><title>ci</title>' > app/dist/index.html
      - run: cargo check -p gesture-synth

  changelog:
    name: Changelog validates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # publishes changelog-badge.json to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - name: Validate with patchnotes (strict)
        uses: Londopy/patchnotes@v2
        with:
          strict: "true"
      # The README's changelog badge is a shields.io endpoint badge that reads
      # changelog-badge.json from the gh-pages branch. That branch only ever
      # holds this one file, so it is rebuilt from scratch and force-pushed.
      - name: Publish the changelog badge to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          patchnotes CHANGELOG.md badge > /tmp/changelog-badge.json
          cat /tmp/changelog-badge.json
          mkdir /tmp/pages && cd /tmp/pages
          git init -q -b gh-pages
          git config user.name "Londopy"
          git config user.email "109172537+Londopy@users.noreply.github.com"
          cp /tmp/changelog-badge.json .
          git add changelog-badge.json
          git commit -qm "changelog badge"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

name: macOS build (opt-in)

# Not part of the release workflow: hosted macOS runners have hung for this
# project in the past. Run this by hand (Actions > macOS build > Run workflow)
# for an existing release tag. It is set up to avoid the known slow paths:
# Apple Silicon runner, arm64 only (no universal lipo), no Homebrew, hard timeout.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .dmg to (e.g. v0.2.0). Leave empty to only upload a workflow artifact."
        required: false
        default: ""
      intel:
        description: "Also build an x86_64 (Intel) .dmg"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-models.mjs
      - name: ffmpeg sidecar (static binary, no Homebrew)
        run: node scripts/fetch-ffmpeg.mjs --static
      - name: Build .dmg (arm64)
        run: npm run tauri:build -- --target aarch64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
          cd out && for f in *.dmg; do mv "$f" "${f%.dmg}_aarch64.dmg"; done
          shasum -a 256 *.dmg > SHA256SUMS-macos-arm64.txt
          cat SHA256SUMS-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*
      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber

  x86_64:
    name: macOS Intel
    if: inputs.intel
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/fetch-models.mjs
      - run: node scripts/fetch-ffmpeg.mjs --static
      - run: npm run tauri:build -- --target x86_64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg out/
          cd out && for f in *.dmg; do mv "$f" "${f%.dmg}_x86_64.dmg"; done
          shasum -a 256 *.dmg > SHA256SUMS-macos-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: out/*
      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber

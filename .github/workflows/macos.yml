name: macOS build (opt-in)

# The release workflow already builds the Apple Silicon .dmg. Use this by hand
# (Actions > macOS build > Run workflow) to add an Intel build to an existing
# release, or to redo the Mac build if the release-time one timed out. It avoids
# the known slow paths: arm64 by default (no universal lipo), no Homebrew, hard timeout.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the .dmg to (e.g. v0.2.0). Leave empty to only upload a workflow artifact."
        required: false
        default: ""
      intel:
        description: "Also build an x86_64 (Intel) .dmg"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-models.mjs
      - name: ffmpeg sidecar (static binary, no Homebrew)
        run: node scripts/fetch-ffmpeg.mjs --static
      - name: Build .dmg (arm64)
        run: npm run tauri:build -- --target aarch64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          # src-tauri is a workspace member, so cargo writes to the root target/ dir.
          # Tauri already names the file "Gesture Synth_<ver>_aarch64.dmg"; drop the space.
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
          cd out && for f in *.dmg; do mv "$f" "${f// /.}"; done
          shasum -a 256 *.dmg > SHA256SUMS-macos-arm64.txt
          cat SHA256SUMS-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: out/*
      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber

  x86_64:
    name: macOS Intel
    if: inputs.intel
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-models.mjs
      - run: node scripts/fetch-ffmpeg.mjs --static
      - run: npm run tauri:build -- --target x86_64-apple-darwin
      - name: Collect
        run: |
          mkdir -p out
          cp target/x86_64-apple-darwin/release/bundle/dmg/*.dmg out/
          cd out && for f in *.dmg; do mv "$f" "${f// /.}"; done
          shasum -a 256 *.dmg > SHA256SUMS-macos-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64
          path: out/*
      - name: Attach to release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ inputs.tag }}" out/* --clobber
